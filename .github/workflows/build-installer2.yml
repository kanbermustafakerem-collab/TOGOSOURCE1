name: Build, Test and Package App

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install Dependencies
      run: |
        py -m pip install --upgrade pip
        pip install pyinstaller flake8
        if (Test-Path requirements.txt) { pip install -r requirements.txt }

    - name: Run Tests
      run: |
        py -m unittest discover -s tests

    - name: Build Executable with PyInstaller
      run: |
        pyinstaller --onefile main.py

    - name: Compile Installer with Inno Setup
      uses: jaywcjlove/github-action-innosetup@v1
      with:
        filepath: InnoSetup/setup.iss

    - name: Upload Installer Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MyPythonApp-Installer
        path: InnoSetup/Outputs/*.exe